name: Run Discord Bot PROD and DEV

on:
  push:
    branches:
      - master
      - development
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set environment variables based on branch
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN_MASTER }}" >> $GITHUB_ENV
            echo "PM2_PROCESS_NAME=discord-bot-prod" >> $GITHUB_ENV
            echo "NODE_ENV=production" >> $GITHUB_ENV
          else
            echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN_DEV }}" >> $GITHUB_ENV
            echo "PM2_PROCESS_NAME=discord-bot-dev" >> $GITHUB_ENV
            echo "NODE_ENV=development" >> $GITHUB_ENV
          fi
          
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'

      - name: Install dependencies
        run: |
          npm ci

      - name: Start bot with PM2
        run: |
          if pm2 describe $PM2_PROCESS_NAME > /dev/null; then
            pm2 restart $PM2_PROCESS_NAME
          else
            pm2 start bot.js --name $PM2_PROCESS_NAME
            pm2 save
          fi